# Spring AI 配置 - 本地 Ollama 接入
# 作业：本地 Ollama 部署 Qwen + Spring AI 接入本地推理
#
# 本作业默认启用 Ollama（spring.ai.model=ollama），原 OpenAI 配置保留但被禁用，
# 切换云端 API 时将 spring.ai.model 改为 openai 即可。

spring:
  ai:
    # 选择默认启用的模型 starter：ollama | openai
    # classpath 同时存在两个 starter 时必须显式声明，否则启动报"multiple ChatClient.Builder"冲突
    model: ollama

    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          # 默认拉取的模型名，需先在本机执行：ollama pull qwen2.5:7b
          model: qwen2.5:7b
          temperature: 0.7
          # 上下文窗口，7B 量化版建议 4096（显存/内存吃紧可降到 2048）
          num-ctx: 4096

    # OpenAI 配置保留，切换时启用并设置 OPENAI_API_KEY 环境变量
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}

server:
  port: 8080

logging:
  level:
    org.springframework.ai: INFO
